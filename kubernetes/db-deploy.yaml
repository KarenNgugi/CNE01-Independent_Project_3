apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbde
  namespace: test-ns
  labels:
    tier: database
spec:
  replicas: 3

  selector:
    matchLabels:
      tier: database

  template:
    metadata:
      labels:
        tier: database
    spec:
      volumes:
        - name: init-db
          configMap:
            name: init-db
      containers:
      - name: tracker-database
        image: postgres:17
        ports:
        - containerPort: 5432
          name: database-port
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: database-configmap
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: database-configmap
              key: POSTGRES_DB
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-password
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: init-db
          mountPath: /docker-entrypoint-initdb.d

