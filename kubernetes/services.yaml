apiVersion: v1
kind: Service
metadata:
  namespace: test-ns
  name: frontend-svc
spec:
  type: NodePort
  selector:
    tier: frontend
  ports:
  - name: frontend-service
    protocol: TCP
    port: 80
    targetPort: frontend-port
    nodePort: 30090

---

apiVersion: v1
kind: Service
metadata:
  namespace: test-ns
  name: backend-svc
spec:
  selector:
    tier: backend
  ports:
  - name: backend-service
    protocol: TCP
    port: 3000
    targetPort: backend-port

---
apiVersion: v1
kind: Service
metadata:
  namespace: test-ns
  name: tracker-backend
spec:
  selector:
    tier: backend
  ports:
  - port: 3000
    targetPort: backend-port

---

apiVersion: v1
kind: Service
metadata:
  namespace: test-ns
  name: database-svc
spec:
  selector:
    tier: database
  ports:
  - name: database-service
    protocol: TCP
    port: 5432
    targetPort: database-port

