apiVersion: v1
kind: Service
metadata:
  namespace: grades-tracker-namespace
  name: backend-svc
spec:
  selector:
    tier: backend
  ports:
  - name: backend-service
    protocol: TCP
    port: 3000
    targetPort: backend-port

---
apiVersion: v1
kind: Service
metadata:
  namespace: grades-tracker-namespace
  name: tracker-backend
spec:
  selector:
    tier: backend
  ports:
  - port: 3000
    targetPort: backend-port
