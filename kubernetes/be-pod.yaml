apiVersion: v1
kind: Pod
metadata:
  namespace: test-ns
  name: backend-pod
  labels:
    network: backend
    tier: backend
spec:
  containers:
  - name: tracker-backend
    image: karenngugi/grades-tracker-backend:1.0.0
    ports:
    - containerPort: 3000
      name: backend-port
    env:
    - name: DB_HOST
      valueFrom: 
        configMapKeyRef:
          name: backend-configmap
          key: DB_HOST
    - name: DB_PORT
      valueFrom: 
        configMapKeyRef:
          name: backend-configmap
          key: DB_PORT
    - name: DB_NAME
      valueFrom: 
        configMapKeyRef:
          name: backend-configmap
          key: DB_NAME
    - name: DB_USER
      valueFrom:
        configMapKeyRef:
          name: backend-configmap
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-password
          key: DB_PASSWORD
    - name: API_PORT
      valueFrom:
        configMapKeyRef:
          name: backend-configmap
          key: API_PORT
