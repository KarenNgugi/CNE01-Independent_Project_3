apiVersion: apps/v1
kind: Deployment
metadata:
  name: grades-tracker-backend-deployment
  namespace: grades-tracker-namespace
  labels:
    tier: backend
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      tier: backend

  template:
    metadata:
      labels:
        tier: backend
    spec:
      containers:
      - name: tracker-backend
        image: karenngugi/grades-tracker-backend:1.0.0
        ports:
        - containerPort: 3000
          name: backend-port
        resources:
          requests:
            cpu: "0.5"
            memory: "256Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
        env:
        - name: DB_HOST
          valueFrom: 
            configMapKeyRef:
              name: backend-configmap
              key: DB_HOST
        - name: DB_PORT
          valueFrom: 
            configMapKeyRef:
              name: backend-configmap
              key: DB_PORT
        - name: DB_NAME
          valueFrom: 
            configMapKeyRef:
              name: backend-configmap
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: backend-configmap
              key: DB_USER
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-configmap
              key: API_PORT
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-password
              key: DB_PASSWORD
