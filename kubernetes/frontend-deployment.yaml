apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: grades-tracker-namespace
  labels:
    tier: frontend
spec:
  replicas: 3

  selector:
    matchLabels:
      tier: frontend

  template:
    metadata:
      labels:
        tier: frontend
    spec:
      containers:
      - name: tracker-frontend
        image: karenngugi/grades-tracker-frontend:1.0.0
        ports:
        - containerPort: 80
       